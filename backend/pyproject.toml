[project]
name = "adaface-recognition-backend"
version = "0.1.0"
description = "AdaFace 人脸识别后端：Flask + 5 策略消融评估"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Web 框架
    "Flask>=2.2,<3.0",
    "Flask-SQLAlchemy>=3.0,<4.0",
    "Flask-Cors>=4.0,<5.0",
    "python-dotenv>=1.0",
    # 配置
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    # 推理（torch 2.x 才有 macOS arm64 原生 wheel；CPU 推理足够）
    "torch>=2.0,<3.0",
    "opencv-python>=4.8,<5.0",
    "Pillow>=10.0",
    "numpy>=1.24,<2.0",
    "tqdm>=4.65",
    # 评估 / 策略
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: 集成测试，需要权重，分钟级",
]
addopts = "-ra -q"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
