[project]
name = "adaface-recognition-backend"
version = "0.1.0"
description = "AdaFace 人脸识别后端：Flask + 5 策略消融评估"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Web 框架
    "Flask>=2.2,<3.0",
    "Flask-SQLAlchemy>=3.0,<4.0",
    "Flask-Cors>=4.0,<5.0",
    "python-dotenv>=1.0",
    # 配置
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    # 推理（torch 2.x 才有 macOS arm64 原生 wheel；CPU 推理足够）
    "torch>=2.0,<3.0",
    "opencv-python>=4.8,<5.0",
    "Pillow>=10.0",
    "numpy>=1.24,<2.0",
    "tqdm>=4.65",
    # 评估 / 策略
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

# 本仓库只用 uv 管理依赖与虚拟环境，不构建可发布的 wheel
[tool.uv]
package = false

# 只推理不训练，35 人 × IR-50 单图 ~100ms，CPU 完全够；
# 全平台统一 CPU wheel，避免 Win 拿到 PyPI 上"伪装版"、Linux 拖 ~2GB CUDA、
# 以及不同同学的 NVIDIA 驱动 / CUDA 版本对不上的麻烦。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    # macOS 不进官方 cpu index（那里没 arm64 wheel），fallback PyPI 拿原生 mac wheel
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
markers = [
    "slow: 集成测试，需要权重，分钟级",
]
addopts = "-ra -q"
testpaths = ["backend/tests"]
